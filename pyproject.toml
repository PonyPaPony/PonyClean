[project]
name = "pony-clean-cli"
version = "0.3.0"
description = "Simple and safe CLI tool for cleaning project junk files"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PonyPaPony" }]
license = "MIT"

keywords = [
  "cli",
  "clean",
  "cleanup",
  "project",
  "filesystem",
  "developer-tools"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/PonyPaPony/PonyClean"
Repository = "https://github.com/PonyPaPony/PonyClean"
Issues = "https://github.com/PonyPaPony/PonyClean/issues"

[project.scripts]
pony-clean = "pony_clean.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["pony_clean*"]
exclude = ["pony_clean.tests*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
